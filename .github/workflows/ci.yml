name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  # Release builds are numbered by workflow run; the same number is the app version and the release tag (v0.1.<n>).
  VALAFIND_VERSION: 0.1.${{ github.run_number }}

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install ffmpeg (Linux audio/video decoding tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Restore
        run: dotnet restore Valafind.slnx

      - name: Build
        run: dotnet build Valafind.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Valafind.slnx --configuration Release --no-build

  model-parity:
    # Downloads EmbeddingGemma 2 once and checks tokenizer + text/picture/audio/video embedding parity against the
    # committed reference, plus end-to-end search.
    name: EmbeddingGemma 2 parity (Linux)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VALAFIND_TEST_MODEL_DIR: ${{ github.workspace }}/.model/embeddinggemma-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .model
          key: embeddinggemma-2-q8-daa72c5
          enableCrossOsArchive: true
      - name: Install ffmpeg (video decoding)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Fetch model
        run: |
          if [ ! -f "$VALAFIND_TEST_MODEL_DIR/onnx/audio_encoder_quantized.onnx_data" ]; then
            bash tools/fetch-model.sh "$VALAFIND_TEST_MODEL_DIR"
          fi
      - name: Embedding tests
        run: dotnet test --project tests/Valafind.Core.Tests --configuration Release -- --filter-namespace "Valafind.Core.Tests.Embedding" --filter-namespace "Valafind.Core.Tests.EndToEnd"

  publish:
    # One self-contained, single-file executable per platform with the EmbeddingGemma 2 model embedded, so a download
    # is all a user needs. macOS additionally gets the same executable wrapped in a zipped Valafind.app.
    name: Publish (${{ matrix.rid }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: Valafind.exe }
          - { os: windows-latest, rid: win-arm64, exe: Valafind.exe }
          - { os: macos-latest, rid: osx-arm64, exe: Valafind }
          - { os: macos-latest, rid: osx-x64, exe: Valafind }
          - { os: ubuntu-latest, rid: linux-x64, exe: Valafind }
          - { os: ubuntu-latest, rid: linux-arm64, exe: Valafind }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Relative for the bash fetch script (Git Bash on Windows), absolute for MSBuild.
      MODEL_DIR: .model/embeddinggemma-2
      MODEL_DIR_ABS: ${{ github.workspace }}/.model/embeddinggemma-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .model
          key: embeddinggemma-2-q8-daa72c5
          enableCrossOsArchive: true
      - name: Fetch model
        shell: bash
        run: |
          if [ ! -f "$MODEL_DIR/onnx/audio_encoder_quantized.onnx_data" ]; then
            bash tools/fetch-model.sh "$MODEL_DIR"
          fi
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Valafind.App -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:ValafindModelDir="$MODEL_DIR_ABS"
          -p:Version=$VALAFIND_VERSION
          -o publish/${{ matrix.rid }}
      - name: Check the output is a single file with the model inside
        shell: bash
        run: |
          ls -la publish/${{ matrix.rid }}
          count=$(find publish/${{ matrix.rid }} -mindepth 1 | wc -l)
          if [ "$count" -ne 1 ] || [ ! -f "publish/${{ matrix.rid }}/${{ matrix.exe }}" ]; then
            echo "::error::Expected exactly one file (${{ matrix.exe }}) in the publish folder, found $count entries."
            exit 1
          fi
          size=$(wc -c < "publish/${{ matrix.rid }}/${{ matrix.exe }}")
          if [ "$size" -lt 800000000 ]; then
            echo "::error::Executable is only $size bytes; the ~850 MB model is not bundled."
            exit 1
          fi
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          ext=""; case "${{ matrix.exe }}" in *.exe) ext=".exe" ;; esac
          cp "publish/${{ matrix.rid }}/${{ matrix.exe }}" "dist/valafind-${{ matrix.rid }}$ext"
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make-app-bundle.sh publish/${{ matrix.rid }} bundle/${{ matrix.rid }} "$VALAFIND_VERSION"
          plutil -lint bundle/${{ matrix.rid }}/Valafind.app/Contents/Info.plist
          ditto -c -k --keepParent bundle/${{ matrix.rid }}/Valafind.app dist/valafind-${{ matrix.rid }}.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: valafind-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          # Already-packed binaries; recompressing ~500 MB per platform only costs time.
          compression-level: 0
          retention-days: 14

  release:
    # Every merge to the default branch becomes a GitHub release with the binaries attached.
    name: GitHub release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [publish, model-parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: v${{ env.VALAFIND_VERSION }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/NOTICE-Gemma.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: valafind-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          # The Gemma Terms of Use (section 3.1) require this notice to accompany redistributed weights.
          cp ../packaging/NOTICE-Gemma.txt .
          sha256sum valafind-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VALAFIND_VERSION"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Valafind $VALAFIND_VERSION" \
            --generate-notes

  store:
    # Sends each release to the Microsoft Store and the Mac App Store; see packaging/store/README.md.
    name: Store release
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/store.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

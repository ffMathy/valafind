name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Valafind.slnx

      - name: Build
        run: dotnet build Valafind.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Valafind.slnx --configuration Release --no-build

  model-parity:
    # Downloads EmbeddingGemma once and checks tokenizer + embedding parity against the committed reference.
    name: EmbeddingGemma parity (Linux)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VALAFIND_TEST_MODEL_DIR: ${{ github.workspace }}/.model/embeddinggemma-300m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .model
          key: embeddinggemma-300m-q8-v1
      - name: Fetch model
        run: |
          if [ ! -f "$VALAFIND_TEST_MODEL_DIR/onnx/model_quantized.onnx_data" ]; then
            bash tools/fetch-model.sh "$VALAFIND_TEST_MODEL_DIR"
          fi
      - name: Embedding tests
        run: dotnet test tests/Valafind.Core.Tests --configuration Release --filter "FullyQualifiedName~Valafind.Core.Tests.Embedding"

  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish src/Valafind.App -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: valafind-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
